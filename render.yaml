# Paid compute is separate from the workspace subscription. Do not select Pro
# just to run these services. Confirm the displayed monthly total before apply.
services:
  - name: forge-span
    type: web
    runtime: docker
    branch: deploy/render-full-stack
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./infra/render/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    disk:
      name: forge-span-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CLOUDEQ_REQUIRE_AUTH
        value: "true"
      - key: CLOUDEQ_WEB_USERNAME
        value: forge
      - key: CLOUDEQ_WEB_PASSWORD
        generateValue: true
      - key: CLOUDEQ_EXECUTION_MODE
        value: render
      - key: CLOUDEQ_AGENT_ENGINE
        value: crewai
      - key: CLOUDEQ_ROUTER_MODE
        value: gemini
      - key: CLOUDEQ_NORMALIZER_MODE
        value: gemini
      - key: CLOUDEQ_GEMINI_LIVE_CALLS
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_AGENT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_ROUTER_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_NORMALIZER_MODEL
        value: gemini-3.5-flash-lite
      - key: CLOUDEQ_GEMINI_TIMEOUT_SECONDS
        value: "60"
      - key: CLOUDEQ_REPAIR_MAX_ITERATIONS
        value: "3"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
      - key: CLOUDEQ_TELEMETRY_BUS
        value: kafka
      - key: KAFKA_HOSTPORT
        fromService:
          name: forge-span-kafka
          type: pserv
          property: hostport
      - key: KAFKA_TELEMETRY_TOPIC
        value: cloudeq.telemetry.live
      - key: KAFKA_CONSUMER_GROUP
        value: cloudeq.observability.render
      - key: CLOUDEQ_OBSERVABILITY_STORE
        value: mongodb
      - key: MONGODB_HOSTPORT
        fromService:
          name: forge-span-mongo
          type: pserv
          property: hostport
      - key: MONGODB_DATABASE
        value: cloudeq
      - key: CLOUDEQ_RUNS_FILE
        value: /var/data/runs.jsonl
      - key: CLOUDEQ_RUNTIME_WORKSPACE_ROOT
        value: /var/data/workspaces
      - key: CLOUDEQ_RUNTIME_TIMEOUT_SECONDS
        value: "120"
      - key: FOAP_RAW_RETENTION_DAYS
        value: ""
      - key: FOAP_CANONICAL_RETENTION_DAYS
        value: ""
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: CREWAI_TELEMETRY_ENABLED
        value: "false"
      - key: ANONYMIZED_TELEMETRY
        value: "false"

  - name: forge-span-kafka
    type: pserv
    runtime: docker
    branch: deploy/render-full-stack
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./infra/render/kafka.Dockerfile
    autoDeployTrigger: "off"
    disk:
      name: forge-span-kafka-data
      mountPath: /var/lib/kafka/data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "9092"
      - key: KAFKA_NODE_ID
        value: "1"
      - key: KAFKA_PROCESS_ROLES
        value: broker,controller
      - key: KAFKA_LISTENERS
        value: PLAINTEXT://:9092,CONTROLLER://:9093
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - key: KAFKA_INTER_BROKER_LISTENER_NAME
        value: PLAINTEXT
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: CONTROLLER
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: 1@localhost:9093
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        value: "1"
      - key: KAFKA_AUTO_CREATE_TOPICS_ENABLE
        value: "true"
      - key: KAFKA_NUM_PARTITIONS
        value: "1"
      - key: KAFKA_LOG_DIRS
        value: /var/lib/kafka/data
      - key: KAFKA_HEAP_OPTS
        value: -Xms256m -Xmx768m

  - name: forge-span-mongo
    type: pserv
    runtime: docker
    branch: deploy/render-full-stack
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./infra/render/mongo.Dockerfile
    autoDeployTrigger: "off"
    disk:
      name: forge-span-mongo-data
      mountPath: /data/db
      sizeGB: 5
    envVars:
      - key: PORT
        value: "27017"

  - name: forge-span-grafana
    type: web
    runtime: docker
    branch: deploy/render-full-stack
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./infra/render/grafana.Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: forge-span-grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: forge
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "false"
      - key: GF_SERVER_HTTP_PORT
        value: "10000"
      - key: FORGE_API_HOSTPORT
        fromService:
          name: forge-span
          type: web
          property: hostport
      - key: FORGE_API_PASSWORD
        fromService:
          name: forge-span
          type: web
          envVarKey: CLOUDEQ_WEB_PASSWORD
