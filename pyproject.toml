[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudeq"
version = "0.2.0"
description = "FORGE SPAN by Cloud EQ: an autonomous multi-agent SDLC framework with federated observability."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Cloud EQ" }]
keywords = ["forge-span", "cloudeq", "sdlc", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "crewai[google-genai]==1.15.34",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2,<3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Real FOAP integrations. The default install runs fully offline without them.
kafka = ["confluent-kafka>=2.4"]
mongo = ["pymongo>=4.7"]
render = [
    "render==1.10.0",
]

[project.scripts]
cloudeq-intake = "cloudeq.plane1_intake.cli:main"
cloudeq-agents = "cloudeq.plane2_agents.cli:main"
cloudeq-server = "cloudeq.platform.server:main"
cloudeq-demo = "cloudeq.platform.demo:main"
cloudeq-observability = "cloudeq.plane4_observability.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "ruff>=0.17.3,<0.18",
  "mypy>=2.4,<3",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudeq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cloudeq"]
namespace_packages = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["crewai", "crewai.*", "confluent_kafka", "confluent_kafka.*", "pymongo", "pymongo.*"]
ignore_missing_imports = true
